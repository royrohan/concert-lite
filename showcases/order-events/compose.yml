# GENERATED by ./generate-concert-ecosystem -- do not edit: regenerated on every run.
# Ecosystem "order-events" as a compose override: its worker(s) (profile order-events) and its roots in the analytics sinks.
#   ./deploy-concert-ecosystem order-events [--store postgres|dynamo|spanner] [--no-analytics]
# or by hand:
#   docker compose -f docker-compose.yml -f showcases/order-events/compose.yml --profile order-events up -d --build
# The sinks add MODELS_DIR_ORDER_EVENTS / SINK_ROOTS_ORDER_EVENTS to their MODELS_DIR / SINK_ROOTS, so several ecosystem
# overrides can be combined (-f ... -f ...).
services:
  # event-style handlers (task queues ev-inventory, ev-orders), same image
  order-events-event-worker:
    profiles: [order-events]
    build:
      context: .
      target: showcase-worker
      args: { MODULE: order-events, MODULE_DIR: showcases/order-events }
    image: concert-temporal/order-events-worker
    entrypoint: ["/app/bin/ecosystem-event-worker"]
    depends_on:
      temporal-init: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }
      coordinator: { condition: service_started }
    environment:
      STORE_KIND: ${STORE_KIND:-postgres}
      TEMPORAL_ADDRESS: temporal:7233
      KINESIS_ENDPOINT: http://localstack:4566
      STORE_JDBC_URL: jdbc:postgresql://dsql:5432/concert
      DYNAMO_ENDPOINT: http://localstack:4566
      SPANNER_EMULATOR_HOST: spanner:9010
      TRACE_SAMPLE: ${TRACE_SAMPLE:-1.0}
      AWS_REGION: us-east-1
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP-kafka:9092}
      SINK_DUCKDB_URL: http://sink-duckdb:8090
      STORE_INIT_SCHEMA: "false"
      JAVA_OPTS: -XX:+UseZGC -XX:+UseCompactObjectHeaders -XX:MaxRAMPercentage=50
      ORDER_EVENTS_EVENT_DOMAINS: ${ORDER_EVENTS_EVENT_DOMAINS:-inventory,orders}
    deploy: { resources: { limits: { memory: 1g } } }
    restart: unless-stopped

  sink-duckdb:
    environment:
      MODELS_DIR_ORDER_EVENTS: /models-eco/order-events
      SINK_ROOTS_ORDER_EVENTS: evt_reserve_inventory_event:inventory::ReserveInventoryEvent,evt_restock_event:inventory::RestockEvent,evt_order_create_event:orders::OrderCreateEvent,evt_order_accepted_event:orders::OrderAcceptedEvent,evt_order_rejected_event:orders::OrderRejectedEvent,evt_order_expiry_check_event:orders::OrderExpiryCheckEvent,evt_payment_capture_event:orders::PaymentCaptureEvent,st_stock:inventory::Stock,st_order:orders::Order
    volumes:
      - ./showcases/order-events/src/main/pure:/models-eco/order-events:ro

  sink-clickhouse:
    environment:
      MODELS_DIR_ORDER_EVENTS: /models-eco/order-events
      SINK_ROOTS_ORDER_EVENTS: evt_reserve_inventory_event:inventory::ReserveInventoryEvent,evt_restock_event:inventory::RestockEvent,evt_order_create_event:orders::OrderCreateEvent,evt_order_accepted_event:orders::OrderAcceptedEvent,evt_order_rejected_event:orders::OrderRejectedEvent,evt_order_expiry_check_event:orders::OrderExpiryCheckEvent,evt_payment_capture_event:orders::PaymentCaptureEvent,st_stock:inventory::Stock,st_order:orders::Order
    volumes:
      - ./showcases/order-events/src/main/pure:/models-eco/order-events:ro

  # concert.py loads app.d/ecosystems/order-events.py only when this is set
  deephaven:
    environment:
      CONCERT_ECOSYSTEM_ORDER_EVENTS: "on"
