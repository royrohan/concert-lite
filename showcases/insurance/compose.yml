# GENERATED by ./generate-concert-ecosystem -- do not edit: regenerated on every run.
# Ecosystem "insurance" as a compose override: its worker(s) (profile insurance) and its roots in the analytics sinks.
#   ./deploy-concert-ecosystem insurance [--store postgres|dynamo|spanner] [--no-analytics]
# or by hand:
#   docker compose -f docker-compose.yml -f showcases/insurance/compose.yml --profile insurance up -d --build
# The sinks add MODELS_DIR_INSURANCE / SINK_ROOTS_INSURANCE to their MODELS_DIR / SINK_ROOTS, so several ecosystem
# overrides can be combined (-f ... -f ...).
services:
  # state machine workers (task queues sm-<smType>)
  insurance-worker:
    profiles: [insurance]
    build:
      context: .
      target: showcase-worker
      args: { MODULE: insurance, MODULE_DIR: showcases/insurance }
    image: concert-temporal/insurance-worker
    depends_on:
      temporal-init: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }
      coordinator: { condition: service_started }
    environment:
      STORE_KIND: ${STORE_KIND:-postgres}
      TEMPORAL_ADDRESS: temporal:7233
      KINESIS_ENDPOINT: http://localstack:4566
      STORE_JDBC_URL: jdbc:postgresql://dsql:5432/concert
      DYNAMO_ENDPOINT: http://localstack:4566
      SPANNER_EMULATOR_HOST: spanner:9010
      TRACE_SAMPLE: ${TRACE_SAMPLE:-1.0}
      AWS_REGION: us-east-1
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP-kafka:9092}
      SINK_DUCKDB_URL: http://sink-duckdb:8090
      STORE_INIT_SCHEMA: "false"
      JAVA_OPTS: -XX:+UseZGC -XX:+UseCompactObjectHeaders -XX:MaxRAMPercentage=50
    deploy: { resources: { limits: { memory: 1g } } }
    restart: unless-stopped

  sink-duckdb:
    environment:
      MODELS_DIR_INSURANCE: /models-eco/insurance
      SINK_ROOTS_INSURANCE: claim:insurance::Claim,payout:insurance::Payout,policy:insurance::Policy
    volumes:
      - ./showcases/insurance/src/main/pure:/models-eco/insurance:ro

  sink-clickhouse:
    environment:
      MODELS_DIR_INSURANCE: /models-eco/insurance
      SINK_ROOTS_INSURANCE: claim:insurance::Claim,payout:insurance::Payout,policy:insurance::Policy
    volumes:
      - ./showcases/insurance/src/main/pure:/models-eco/insurance:ro

  # concert.py loads app.d/ecosystems/insurance.py only when this is set
  deephaven:
    environment:
      CONCERT_ECOSYSTEM_INSURANCE: "on"
