# GENERATED by ./generate-concert-ecosystem -- do not edit: regenerated on every run.
# Ecosystem "library" as a compose override: its worker(s) (profile library) and its roots in the analytics sinks.
#   ./deploy-concert-ecosystem library [--store postgres|dynamo|spanner] [--no-analytics]
# or by hand:
#   docker compose -f docker-compose.yml -f showcases/library/compose.yml --profile library up -d --build
# The sinks add MODELS_DIR_LIBRARY / SINK_ROOTS_LIBRARY to their MODELS_DIR / SINK_ROOTS, so several ecosystem
# overrides can be combined (-f ... -f ...).
services:
  # the flow's coordinator: its own Kinesis stream concert-library, ingest and locks (task queue orchestration-library)
  library-coordinator:
    profiles: [library]
    build: { context: ., target: "${COORDINATOR_TARGET:-coordinator}" }
    image: concert-temporal/${COORDINATOR_TARGET:-coordinator}
    depends_on:
      temporal-init: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }
    environment:
      STORE_KIND: ${STORE_KIND:-postgres}
      TEMPORAL_ADDRESS: temporal:7233
      KINESIS_ENDPOINT: http://localstack:4566
      STORE_JDBC_URL: jdbc:postgresql://dsql:5432/concert
      DYNAMO_ENDPOINT: http://localstack:4566
      SPANNER_EMULATOR_HOST: spanner:9010
      TRACE_SAMPLE: ${TRACE_SAMPLE:-1.0}
      AWS_REGION: us-east-1
      CONCERT_FLOW: library
      # Temporal / worker tuning (the dashboard's Performance presets set these)
      WORKFLOW_TASK_TIMEOUT_MS: ${WORKFLOW_TASK_TIMEOUT_MS:-2000}
      WORKER_WF_SLOTS: ${WORKER_WF_SLOTS:-1000}
      WORKER_LA_SLOTS: ${WORKER_LA_SLOTS:-2000}
      ORCH_WF_POLLERS_MAX: ${ORCH_WF_POLLERS_MAX:-64}
      INGEST_PARALLEL_GROUPS: ${INGEST_PARALLEL_GROUPS:-256}
      STORE_INIT_SCHEMA: "false"
      INGEST_IDLE_POLL_MS: ${INGEST_IDLE_POLL_MS:-200}   # idle shard poll; 20 for latency benchmarks
    restart: unless-stopped

  # state machine workers (task queues sm-<smType>)
  library-worker:
    profiles: [library]
    build:
      context: .
      target: showcase-worker
      args: { MODULE: library, MODULE_DIR: showcases/library }
    image: concert-temporal/library-worker
    depends_on:
      temporal-init: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }
      library-coordinator: { condition: service_started }
    environment:
      STORE_KIND: ${STORE_KIND:-postgres}
      TEMPORAL_ADDRESS: temporal:7233
      KINESIS_ENDPOINT: http://localstack:4566
      STORE_JDBC_URL: jdbc:postgresql://dsql:5432/concert
      DYNAMO_ENDPOINT: http://localstack:4566
      SPANNER_EMULATOR_HOST: spanner:9010
      TRACE_SAMPLE: ${TRACE_SAMPLE:-1.0}
      AWS_REGION: us-east-1
      CONCERT_FLOW: library
      # Temporal / worker tuning (the dashboard's Performance presets set these)
      WORKFLOW_TASK_TIMEOUT_MS: ${WORKFLOW_TASK_TIMEOUT_MS:-2000}
      WORKER_WF_SLOTS: ${WORKER_WF_SLOTS:-1000}
      WORKER_LA_SLOTS: ${WORKER_LA_SLOTS:-2000}
      ORCH_WF_POLLERS_MAX: ${ORCH_WF_POLLERS_MAX:-64}
      INGEST_PARALLEL_GROUPS: ${INGEST_PARALLEL_GROUPS:-256}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP-kafka:9092}
      SINK_DUCKDB_URL: http://sink-duckdb:8090
      STORE_INIT_SCHEMA: "false"
      JAVA_OPTS: -XX:+UseZGC -XX:+UseCompactObjectHeaders -XX:MaxRAMPercentage=50
    deploy: { resources: { limits: { memory: 1g } } }
    restart: unless-stopped

  sink-duckdb:
    environment:
      MODELS_DIR_LIBRARY: /models-eco/library
      SINK_ROOTS_LIBRARY: loan:library::Loan
    volumes:
      - ./showcases/library/src/main/pure:/models-eco/library:ro

  sink-clickhouse:
    environment:
      MODELS_DIR_LIBRARY: /models-eco/library
      SINK_ROOTS_LIBRARY: loan:library::Loan
    volumes:
      - ./showcases/library/src/main/pure:/models-eco/library:ro

  # concert.py loads app.d/ecosystems/library.py only when this is set
  deephaven:
    environment:
      CONCERT_ECOSYSTEM_LIBRARY: "on"
