# GENERATED by ./generate-concert-ecosystem -- do not edit: regenerated on every run.
# Ecosystem "trading-gen" as a compose override: its worker(s) (profile trading-gen) and its roots in the analytics sinks.
#   ./deploy-concert-ecosystem trading-gen [--store postgres|dynamo|spanner] [--no-analytics]
# or by hand:
#   docker compose -f docker-compose.yml -f showcases/trading-gen/compose.yml --profile trading-gen up -d --build
# The sinks add MODELS_DIR_TRADING_GEN / SINK_ROOTS_TRADING_GEN to their MODELS_DIR / SINK_ROOTS, so several ecosystem
# overrides can be combined (-f ... -f ...).
services:
  # the flow's coordinator: its own Kinesis stream concert-trading-gen, ingest and locks (task queue orchestration-trading-gen)
  trading-gen-coordinator:
    profiles: [trading-gen]
    build: { context: ., target: "${COORDINATOR_TARGET:-coordinator}" }
    image: concert-temporal/${COORDINATOR_TARGET:-coordinator}
    depends_on:
      temporal-init: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }
    environment:
      STORE_KIND: ${STORE_KIND:-postgres}
      TEMPORAL_ADDRESS: temporal:7233
      KINESIS_ENDPOINT: http://localstack:4566
      STORE_JDBC_URL: jdbc:postgresql://dsql:5432/concert
      DYNAMO_ENDPOINT: http://localstack:4566
      SPANNER_EMULATOR_HOST: spanner:9010
      TRACE_SAMPLE: ${TRACE_SAMPLE:-1.0}
      AWS_REGION: us-east-1
      CONCERT_FLOW: trading-gen
      # Temporal / worker tuning (the dashboard's Performance presets set these)
      WORKFLOW_TASK_TIMEOUT_MS: ${WORKFLOW_TASK_TIMEOUT_MS:-2000}
      WORKER_WF_SLOTS: ${WORKER_WF_SLOTS:-1000}
      WORKER_LA_SLOTS: ${WORKER_LA_SLOTS:-2000}
      ORCH_WF_POLLERS_MAX: ${ORCH_WF_POLLERS_MAX:-64}
      INGEST_PARALLEL_GROUPS: ${INGEST_PARALLEL_GROUPS:-256}
      STORE_INIT_SCHEMA: "false"
    restart: unless-stopped

  # state machine workers (task queues sm-<smType>)
  trading-gen-worker:
    profiles: [trading-gen]
    build:
      context: .
      target: showcase-worker
      args: { MODULE: trading-gen, MODULE_DIR: showcases/trading-gen }
    image: concert-temporal/trading-gen-worker
    depends_on:
      temporal-init: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }
      trading-gen-coordinator: { condition: service_started }
    environment:
      STORE_KIND: ${STORE_KIND:-postgres}
      TEMPORAL_ADDRESS: temporal:7233
      KINESIS_ENDPOINT: http://localstack:4566
      STORE_JDBC_URL: jdbc:postgresql://dsql:5432/concert
      DYNAMO_ENDPOINT: http://localstack:4566
      SPANNER_EMULATOR_HOST: spanner:9010
      TRACE_SAMPLE: ${TRACE_SAMPLE:-1.0}
      AWS_REGION: us-east-1
      CONCERT_FLOW: trading-gen
      # Temporal / worker tuning (the dashboard's Performance presets set these)
      WORKFLOW_TASK_TIMEOUT_MS: ${WORKFLOW_TASK_TIMEOUT_MS:-2000}
      WORKER_WF_SLOTS: ${WORKER_WF_SLOTS:-1000}
      WORKER_LA_SLOTS: ${WORKER_LA_SLOTS:-2000}
      ORCH_WF_POLLERS_MAX: ${ORCH_WF_POLLERS_MAX:-64}
      INGEST_PARALLEL_GROUPS: ${INGEST_PARALLEL_GROUPS:-256}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP-kafka:9092}
      SINK_DUCKDB_URL: http://sink-duckdb:8090
      STORE_INIT_SCHEMA: "false"
      JAVA_OPTS: -XX:+UseZGC -XX:+UseCompactObjectHeaders -XX:MaxRAMPercentage=50
    deploy: { resources: { limits: { memory: 1g } } }
    restart: unless-stopped

  sink-duckdb:
    environment:
      MODELS_DIR_TRADING_GEN: /models-eco/trading-gen
      SINK_ROOTS_TRADING_GEN: gen_trading_system:trading::order::Trade,gen_trading_order:trading::order::Order,gen_trading_execution:trading::order::Execution,gen_trading_fill:trading::order::Fill,gen_trading_allocation:trading::order::Allocation
    volumes:
      - ./showcases/trading-gen/src/main/pure:/models-eco/trading-gen:ro

  sink-clickhouse:
    environment:
      MODELS_DIR_TRADING_GEN: /models-eco/trading-gen
      SINK_ROOTS_TRADING_GEN: gen_trading_system:trading::order::Trade,gen_trading_order:trading::order::Order,gen_trading_execution:trading::order::Execution,gen_trading_fill:trading::order::Fill,gen_trading_allocation:trading::order::Allocation
    volumes:
      - ./showcases/trading-gen/src/main/pure:/models-eco/trading-gen:ro

  # concert.py loads app.d/ecosystems/trading-gen.py only when this is set
  deephaven:
    environment:
      CONCERT_ECOSYSTEM_TRADING_GEN: "on"
