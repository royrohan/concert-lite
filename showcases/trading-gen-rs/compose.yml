# GENERATED by ./generate-concert-ecosystem -- do not edit: regenerated on every run.
# Ecosystem "trading-gen-rs" as a compose override: its worker(s) (profile trading-gen-rs) and its roots in the analytics sinks.
#   ./deploy-concert-ecosystem trading-gen-rs [--store postgres|dynamo|spanner] [--no-analytics]
# or by hand:
#   docker compose -f docker-compose.yml -f showcases/trading-gen-rs/compose.yml --profile trading-gen-rs up -d --build
# The sinks add MODELS_DIR_TRADING_GEN_RS / SINK_ROOTS_TRADING_GEN_RS to their MODELS_DIR / SINK_ROOTS, so several ecosystem
# overrides can be combined (-f ... -f ...).
services:
  # the flow's coordinator (Rust, platform/coordinator-rs): its own Kinesis stream concert-trading-gen-rs, ingest and locks (task queue orchestration-trading-gen-rs)
  trading-gen-rs-coordinator:
    profiles: [trading-gen-rs]
    build: { context: ., target: coordinator-rs }
    image: concert-temporal/coordinator-rs
    depends_on:
      temporal-init: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }
    environment:
      STORE_KIND: ${STORE_KIND:-postgres}
      TEMPORAL_ADDRESS: temporal:7233
      KINESIS_ENDPOINT: http://localstack:4566
      STORE_JDBC_URL: jdbc:postgresql://dsql:5432/concert
      DYNAMO_ENDPOINT: http://localstack:4566
      SPANNER_EMULATOR_HOST: spanner:9010
      TRACE_SAMPLE: ${TRACE_SAMPLE:-1.0}
      AWS_REGION: us-east-1
      CONCERT_FLOW: trading-gen-rs
      # Temporal / worker tuning (the dashboard's Performance presets set these)
      WORKFLOW_TASK_TIMEOUT_MS: ${WORKFLOW_TASK_TIMEOUT_MS:-2000}
      WORKER_WF_SLOTS: ${WORKER_WF_SLOTS:-1000}
      WORKER_LA_SLOTS: ${WORKER_LA_SLOTS:-2000}
      ORCH_WF_POLLERS_MAX: ${ORCH_WF_POLLERS_MAX:-64}
      INGEST_PARALLEL_GROUPS: ${INGEST_PARALLEL_GROUPS:-256}
      STORE_INIT_SCHEMA: "false"
      INGEST_IDLE_POLL_MS: ${INGEST_IDLE_POLL_MS:-200}   # idle shard poll; 20 for latency benchmarks
    restart: unless-stopped

  # state machine workers (task queues sm-<smType>)
  trading-gen-rs-worker:
    profiles: [trading-gen-rs]
    build:
      context: .
      target: showcase-worker
      args: { MODULE: trading-gen-rs, MODULE_DIR: showcases/trading-gen-rs }
    image: concert-temporal/trading-gen-rs-worker
    depends_on:
      temporal-init: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }
      trading-gen-rs-coordinator: { condition: service_started }
    environment:
      STORE_KIND: ${STORE_KIND:-postgres}
      TEMPORAL_ADDRESS: temporal:7233
      KINESIS_ENDPOINT: http://localstack:4566
      STORE_JDBC_URL: jdbc:postgresql://dsql:5432/concert
      DYNAMO_ENDPOINT: http://localstack:4566
      SPANNER_EMULATOR_HOST: spanner:9010
      TRACE_SAMPLE: ${TRACE_SAMPLE:-1.0}
      AWS_REGION: us-east-1
      CONCERT_FLOW: trading-gen-rs
      # Temporal / worker tuning (the dashboard's Performance presets set these)
      WORKFLOW_TASK_TIMEOUT_MS: ${WORKFLOW_TASK_TIMEOUT_MS:-2000}
      WORKER_WF_SLOTS: ${WORKER_WF_SLOTS:-1000}
      WORKER_LA_SLOTS: ${WORKER_LA_SLOTS:-2000}
      ORCH_WF_POLLERS_MAX: ${ORCH_WF_POLLERS_MAX:-64}
      INGEST_PARALLEL_GROUPS: ${INGEST_PARALLEL_GROUPS:-256}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP-kafka:9092}
      SINK_DUCKDB_URL: http://sink-duckdb:8090
      STORE_INIT_SCHEMA: "false"
      JAVA_OPTS: -XX:+UseZGC -XX:+UseCompactObjectHeaders -XX:MaxRAMPercentage=50
    deploy: { resources: { limits: { memory: 1g } } }
    restart: unless-stopped

  sink-duckdb:
    environment:
      MODELS_DIR_TRADING_GEN_RS: /models-eco/trading-gen-rs
      SINK_ROOTS_TRADING_GEN_RS: rs_trading_system:trading::order::Trade,rs_trading_order:trading::order::Order,rs_trading_execution:trading::order::Execution,rs_trading_fill:trading::order::Fill,rs_trading_allocation:trading::order::Allocation
    volumes:
      - ./showcases/trading-gen-rs/src/main/pure:/models-eco/trading-gen-rs:ro

  sink-clickhouse:
    environment:
      MODELS_DIR_TRADING_GEN_RS: /models-eco/trading-gen-rs
      SINK_ROOTS_TRADING_GEN_RS: rs_trading_system:trading::order::Trade,rs_trading_order:trading::order::Order,rs_trading_execution:trading::order::Execution,rs_trading_fill:trading::order::Fill,rs_trading_allocation:trading::order::Allocation
    volumes:
      - ./showcases/trading-gen-rs/src/main/pure:/models-eco/trading-gen-rs:ro

  # concert.py loads app.d/ecosystems/trading-gen-rs.py only when this is set
  deephaven:
    environment:
      CONCERT_ECOSYSTEM_TRADING_GEN_RS: "on"
