# GENERATED by ./generate-concert-ecosystem -- do not edit: regenerated on every run.
# Ecosystem "payments" as a compose override: its worker(s) (profile payments) and its roots in the analytics sinks.
#   ./deploy-concert-ecosystem payments [--store postgres|dynamo|spanner] [--no-analytics]
# or by hand:
#   docker compose -f docker-compose.yml -f showcases/payments/compose.yml --profile payments up -d --build
# The sinks add MODELS_DIR_PAYMENTS / SINK_ROOTS_PAYMENTS to their MODELS_DIR / SINK_ROOTS, so several ecosystem
# overrides can be combined (-f ... -f ...).
services:
  # the flow's coordinator: its own Kinesis stream concert-payments, ingest and locks (task queue orchestration-payments)
  payments-coordinator:
    profiles: [payments]
    build: { context: ., target: "${COORDINATOR_TARGET:-coordinator}" }
    image: concert-temporal/${COORDINATOR_TARGET:-coordinator}
    depends_on:
      temporal-init: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }
    environment:
      STORE_KIND: ${STORE_KIND:-postgres}
      TEMPORAL_ADDRESS: temporal:7233
      KINESIS_ENDPOINT: http://localstack:4566
      STORE_JDBC_URL: jdbc:postgresql://dsql:5432/concert
      DYNAMO_ENDPOINT: http://localstack:4566
      SPANNER_EMULATOR_HOST: spanner:9010
      TRACE_SAMPLE: ${TRACE_SAMPLE:-1.0}
      AWS_REGION: us-east-1
      CONCERT_FLOW: payments
      # Temporal / worker tuning (the dashboard's Performance presets set these)
      WORKFLOW_TASK_TIMEOUT_MS: ${WORKFLOW_TASK_TIMEOUT_MS:-2000}
      WORKER_WF_SLOTS: ${WORKER_WF_SLOTS:-1000}
      WORKER_LA_SLOTS: ${WORKER_LA_SLOTS:-2000}
      ORCH_WF_POLLERS_MAX: ${ORCH_WF_POLLERS_MAX:-64}
      INGEST_PARALLEL_GROUPS: ${INGEST_PARALLEL_GROUPS:-256}
      DIRECT_SM_TYPES: ${DIRECT_SM_TYPES:-}
      STORE_INIT_SCHEMA: "false"
      INGEST_IDLE_POLL_MS: ${INGEST_IDLE_POLL_MS:-200}   # idle shard poll; 20 for latency benchmarks
    restart: unless-stopped

  # state machine workers (task queues sm-<smType>)
  payments-worker:
    profiles: [payments]
    build:
      context: .
      target: showcase-worker
      args: { MODULE: payments, MODULE_DIR: showcases/payments }
    image: concert-temporal/payments-worker
    depends_on:
      temporal-init: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }
      payments-coordinator: { condition: service_started }
    environment:
      STORE_KIND: ${STORE_KIND:-postgres}
      TEMPORAL_ADDRESS: temporal:7233
      KINESIS_ENDPOINT: http://localstack:4566
      STORE_JDBC_URL: jdbc:postgresql://dsql:5432/concert
      DYNAMO_ENDPOINT: http://localstack:4566
      SPANNER_EMULATOR_HOST: spanner:9010
      TRACE_SAMPLE: ${TRACE_SAMPLE:-1.0}
      AWS_REGION: us-east-1
      CONCERT_FLOW: payments
      # Temporal / worker tuning (the dashboard's Performance presets set these)
      WORKFLOW_TASK_TIMEOUT_MS: ${WORKFLOW_TASK_TIMEOUT_MS:-2000}
      WORKER_WF_SLOTS: ${WORKER_WF_SLOTS:-1000}
      WORKER_LA_SLOTS: ${WORKER_LA_SLOTS:-2000}
      ORCH_WF_POLLERS_MAX: ${ORCH_WF_POLLERS_MAX:-64}
      INGEST_PARALLEL_GROUPS: ${INGEST_PARALLEL_GROUPS:-256}
      DIRECT_SM_TYPES: ${DIRECT_SM_TYPES:-}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP-kafka:9092}
      SINK_DUCKDB_URL: http://sink-duckdb:8090
      STORE_INIT_SCHEMA: "false"
      JAVA_OPTS: -XX:+UseZGC -XX:+UseCompactObjectHeaders -XX:MaxRAMPercentage=50
    deploy: { resources: { limits: { memory: 1g } } }
    restart: unless-stopped

  sink-duckdb:
    environment:
      MODELS_DIR_PAYMENTS: /models-eco/payments
      SINK_ROOTS_PAYMENTS: settlement:payments::Payment
    volumes:
      - ./showcases/payments/src/main/pure:/models-eco/payments:ro

  sink-clickhouse:
    environment:
      MODELS_DIR_PAYMENTS: /models-eco/payments
      SINK_ROOTS_PAYMENTS: settlement:payments::Payment
    volumes:
      - ./showcases/payments/src/main/pure:/models-eco/payments:ro

  # concert.py loads app.d/ecosystems/payments.py only when this is set
  deephaven:
    environment:
      CONCERT_ECOSYSTEM_PAYMENTS: "on"
