  if (!modelFlow) history.replaceState(null, '', '#model/' + encodeURIComponent(q)); // shareable: opening the link runs it
  st.textContent = 'planning…';
  const d = await apiJson('/api/model/query', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query: q, stores: modelStores.join(','), variant: modelVariant }) });
  st.textContent = d.planMs !== undefined ? `${d.planMs} ms` : '';
  if (d.error) { res.innerHTML = `<div class="panel FAILED mono" style="white-space:pre-wrap">${esc(d.error)}</div>`; return; }
  const cell = v => v === null ? '<span class="null">null</span>' : esc(typeof v === 'object' ? JSON.stringify(v) : v);
  const one = (k, r) => `<div class="panel"><h3>${k === 'duckdb' ? 'DuckDB' : 'ClickHouse'}
      ${r.error ? status('bad', 'Failed') : `<span class="muted" style="font-weight:400;font-size:12px">${fmt(r.rows.length)} rows${r.truncated ? ' (truncated)' : ''} · plan ${r.planMs} ms · run ${r.elapsedMs} ms</span>`}</h3>
    ${r.sql ? `<details ${r.error ? 'open' : ''}><summary class="muted">generated SQL</summary><pre class="sql">${esc(r.sql)}</pre></details>` : ''}
    ${r.error ? `<div class="FAILED mono" style="white-space:pre-wrap">${esc(r.error)}</div>`
      : r.columns.length ? `<div style="overflow-x:auto"><table class="results"><tr>${r.columns.map((c, i) => `<th title="${esc((r.types || [])[i] || '')}">${esc(c)}</th>`).join('')}</tr>
        ${r.rows.map(row => `<tr>${row.map(v => `<td title="${esc(v)}">${cell(v)}</td>`).join('')}</tr>`).join('')}</table></div>` : '<span class="muted">No result set.</span>'}</div>`;
  res.innerHTML = `<div class="model-results">${Object.entries(d.results).map(([k, r]) => one(k, r)).join('')}</div>`;
}

// Diagrams of the emitted models (/api/model/diagrams): per machine its states (event + payload class), the classes
// doing the transitions (entity root + payload classes) and its whole Pure model; event catalogs' flow and model.
let diagramsData = null;
async function showDiagrams(sel) {
  setView('model'); clearTimeout(flowTimer);
  diagramsData = diagramsData || await apiJson('/api/model/diagrams');
  const d = diagramsData;
  const machines = d.machines || [], events = d.eventCatalogs || [];
  sel = sel || (machines[0] && machines[0].smType) || (events[0] && 'events:' + events[0].name);
  setHash('diagrams/' + encodeURIComponent(sel || ''));
  const byCatalog = {};
  machines.forEach(m => (byCatalog[m.catalog] = byCatalog[m.catalog] || []).push(m));
  const item = (key, label, n) => `<li onclick="showDiagrams('${esc(key)}')" style="${key === sel ? 'color:var(--accent);font-weight:600' : ''}">
    <span>${esc(label)}</span><span class="muted">${n}</span></li>`;
  out.innerHTML = `<div class="crumbs"><h2>Diagrams</h2><span class="muted">the emitted models: states, the classes doing the transitions, Pure classes</span>
      <span class="spacer"></span><a onclick="showModel()">model query ›</a></div>
    <div class="analytics">
      <aside class="panel browser">
        ${Object.entries(byCatalog).map(([c, ms]) => `<details open><summary>${esc(c)}</summary><ul>
          ${ms.map(m => item(m.smType, m.smType, m.transitions.length + ' →')).join('')}</ul></details>`).join('')}
        ${events.length ? `<details open><summary>event catalogs</summary><ul>${events.map(e => item('events:' + e.name, e.name, '')).join('')}</ul></details>` : ''}
      </aside>
      <section id="dg-body"></section>
    </div>`;
  await renderDiagram(sel, machines, events);
}

/** The diagrams of one machine (smType) or event catalog ('events:<name>') into #dg-body. */
async function renderDiagram(sel, machines, events) {
  const body = document.getElementById('dg-body');
  const panel = (id, title, note, open = true) => `<div class="panel"><details ${open ? 'open' : ''}><summary><h3 style="display:inline">${title}</h3>
    <span class="muted">${note}</span></summary><div id="${id}" style="overflow:auto"></div></details></div>`;
  const diagrams = [];
  if (sel && sel.startsWith('events:')) {
    const e = events.find(x => 'events:' + x.name === sel);
    if (!e) { body.innerHTML = '<div class="panel muted">Unknown catalog.</div>'; return; }
    body.innerHTML = panel('dg-flow', 'Event flow', 'event types, what each emits') + panel('dg-model', 'Model', 'payload and state classes (Pure)');
    diagrams.push(['dg-flow', e.flowMermaid], ['dg-model', e.modelMermaid]);
  } else {
    const m = machines.find(x => x.smType === sel);
    if (!m) { body.innerHTML = '<div class="panel muted">No machines on the class path.</div>'; return; }
    body.innerHTML = `<div class="panel"><div class="kv"><span class="muted">machine</span><span class="mono">${esc(m.smType)}</span>
        <span class="muted">catalog</span><span>${esc(m.catalog)}</span>
        <span class="muted">entity class</span><span class="mono">${esc(m.root || '(untyped)')}</span>
        <span class="muted">states</span><span class="mono">${esc(m.initial)} → … → ${esc(m.terminal.join(', '))}</span></div></div>`
      + panel('dg-states', 'State machine', 'each transition: event (payload class)')
      + panel('dg-classes', 'Transition classes', 'the entity class and the payload classes that move it, linked by event')
      + (m.modelMermaid ? panel('dg-model', 'Pure model', 'every class of the machine\'s model files', false) : '')
      + (m.emits && m.emits.length ? `<div class="panel"><h3>Emits <span class="muted" style="font-weight:400">event chaining declared in Pure (concert::sm.emits)</span></h3>
        <table><tr><th>on entering</th><th>emits</th><th>instance key</th><th>fields</th></tr>
        ${m.emits.map(x => `<tr><td class="mono">${esc(x.onEnter.join(' | '))}</td><td class="mono">${esc(x.smType)}.${esc(x.event)}</td>
          <td class="mono">${esc(x.key)}</td><td class="mono muted">${esc(Object.entries(x.fields).map(([k, v]) => k + ' = ' + v).join(', ') || 'copied by name')}</td></tr>`).join('')}</table></div>` : '')
      + `<div class="panel"><h3>Transitions</h3><table><tr><th>from</th><th>event</th><th>to</th><th>payload class</th></tr>
        ${m.transitions.map(t => `<tr><td class="mono">${esc(t.from)}</td><td class="mono">${esc(t.event)}</td><td class="mono">${esc(t.to)}</td>
          <td class="mono muted">${esc(t.payload || '')}</td></tr>`).join('')}</table></div>`;
    diagrams.push(['dg-states', m.stateMermaid], ['dg-classes', m.transitionMermaid], ['dg-model', m.modelMermaid]);
  }
  for (const [id, src] of diagrams) {
    const el = document.getElementById(id);
    if (!el || !src) continue;
    try { el.innerHTML = (await mermaid.render(id + Date.now(), src)).svg; }
    catch (err) { el.textContent = 'diagram: ' + err; }
  }
}

/** Opens the page of the current hash (on load, and to redraw after a theme switch). Startup lands on the flows. */
// ---------------------------------------------------------------- Performance: one flow at a time, measured on its own

let perfTimer = null, perfLast = null, perfSetup = false;
let perfForm = (() => { try { return JSON.parse(localStorage.getItem('perfForm') || '{}'); } catch (e) { return {}; } })();
function savePerfForm() { try { localStorage.setItem('perfForm', JSON.stringify(perfForm)); } catch (e) { /* private window */ } }

async function showPerf() {
  setView('perf'); setHash('perf');
  clearTimeout(perfTimer);
  if (!document.getElementById('perf-root')) out.innerHTML = '<div class="panel muted">Loading…</div>';
  const p = await apiJson('/api/perf');
  if (!location.hash.startsWith('#perf')) return;
  if (p.error) { out.innerHTML = `<div class="panel FAILED">${esc(p.error)}</div>`; return; }
  perfLast = p;
  let d = null;
  if (p.run && !(perfSetup)) {
    d = await apiJson('/api/flows/' + encodeURIComponent(p.run.machine) + '?window=' + flowWindow);
    if (!location.hash.startsWith('#perf')) return;
    if (!d.error) lastFlow = d;
  }
  renderPerf(p, d);
  // The setup form is not refreshed while it is open (it would reset what you are typing), unless a job runs.
  const busy = jobRunning(p.job);
  if (busy || (p.run && !perfSetup)) perfTimer = setTimeout(() => location.hash.startsWith('#perf') && showPerf(), busy ? 1500 : 3000);
}

function renderPerf(p, d) {
  const run = p.run, setup = !run || perfSetup;
  const busy = jobRunning(p.job);
  out.innerHTML = `<div id="perf-root"><div class="crumbs"><h2>Performance</h2>
      <span class="muted">one flow at a time, measured on its own</span><span class="spacer"></span>
      ${run && !setup ? `<button class="ghost" onclick="perfSetup=true;renderPerf(perfLast,null)" ${busy ? 'disabled' : ''}>New run…</button>` : ''}
      ${run && setup ? `<button class="ghost" onclick="perfSetup=false;showPerf()">Back to the run</button>` : ''}
      ${run && !setup ? windowPicker('showPerf()') : ''}</div>
    ${p.docker ? `<div class="panel">${status('bad', 'No Docker control')} ${esc(p.docker)}</div>` : ''}
    ${p.job && p.job.action ? `<div class="panel">${jobLog(p.job)}</div>` : ''}
    ${setup ? perfSetupPanel(p) : perfRunPanel(p) + perfInstancesPanel(p) + perfMetrics(d, p) + perfTimeline(p)}
    <div id="perf-history">${perfHistoryPanel(p)}</div></div>`;
}

function perfFlow(p) {
  const ids = p.flows.map(f => f.id);
  const id = ids.includes(perfForm.flow) ? perfForm.flow : ids.includes('trading-gen-rs') ? 'trading-gen-rs' : ids[0];
  return p.flows.find(f => f.id === id);
}
function perfPreset(p) { return p.presets.find(x => x.id === perfForm.preset) || p.presets.find(x => x.id === 'balanced') || p.presets[0]; }

function perfSetupPanel(p) {
  if (!p.flows.length) return '<div class="panel muted">No state machine flow is registered.</div>';
  const f = perfFlow(p), pr = perfPreset(p);
  const machine = f.machines.includes(perfForm.machine) ? perfForm.machine : f.defaultMachine;
  const v = (k, dflt) => perfForm[k] ?? dflt;
  const opt = (val, cur, label) => `<option value="${esc(val)}" ${val == cur ? 'selected' : ''}>${esc(label)}</option>`;
  const presetCard = x => `<div class="preset ${x.id === pr.id ? 'on' : ''}" tabindex="0" role="radio" aria-checked="${x.id === pr.id}"
      onclick="perfPick('${esc(x.id)}')" onkeydown="if(event.key==='Enter'||event.key===' ')perfPick('${esc(x.id)}')">
      <span class="lbl">${esc(x.label)}</span><span class="muted" style="font-size:12px">${esc(x.note)}</span>
      <span class="tun">${x.rate}/s load${Object.entries(x.tuning).map(([k, val]) => ` · ${esc(k)}=${esc(val)}`).join('') || ' · default tuning'}</span></div>`;
  const others = p.otherFlowsRunning || [];
  const analyticsUp = (p.analytics || []).filter(a => a.state === 'running').map(a => a.service);
  return `<div class="panel"><h3>1. Flow</h3>
      <div class="perfform">
        <label>flow <select id="pf-flow" onchange="perfForm.flow=this.value;perfForm.machine=null;savePerfForm();renderPerf(perfLast,null)">
          ${p.flows.map(x => opt(x.id, f.id, x.label + (x.coordinatorImpl === 'rust' ? ' (Rust coordinator)' : ' (Java coordinator)'))).join('')}</select></label>
        <label>load on <select id="pf-machine" onchange="perfForm.machine=this.value;savePerfForm()">${f.machines.map(m => opt(m, machine, m)).join('')}</select></label>
      </div>
      <div class="note">Only one flow runs during a run: starting it stops every other flow. Load replays the machine's sample flow with unique
        ids per instance; a chain entry point (<span class="mono">*_system</span>) sends every instance's chained events through the sample's one account, a single lock key.</div></div>
    <div class="panel"><h3>2. Configuration</h3>
      <div class="presets" role="radiogroup">${p.presets.map(presetCard).join('')}</div>
      <div class="perfform">
        <label>coordinators <input type="number" id="pf-coord" min="1" max="8" value="${v('coordinators', pr.coordinators)}" oninput="perfForm.coordinators=+this.value;savePerfForm()"></label>
        <label>workers <input type="number" id="pf-work" min="1" max="8" value="${v('workers', pr.workers)}" oninput="perfForm.workers=+this.value;savePerfForm()"></label>
        <label>load <input type="number" id="pf-rate" min="0.5" max="500" step="0.5" value="${v('rate', pr.rate)}" oninput="perfForm.rate=+this.value;savePerfForm()"> instances/s</label>
        <label>for <select id="pf-dur" onchange="perfForm.duration=+this.value;savePerfForm()">${[60, 300, 600, 1800, 3600].map(x => opt(x, v('duration', 300), x < 120 ? x + ' s' : x / 60 + ' min')).join('')}</select></label>
      </div>
      <div class="note">Replicas run with <span class="mono">docker compose --scale</span>; the tuning applies to this flow's coordinator and worker containers.</div></div>
    <div class="panel"><h3>3. Lock keys</h3>
      <div class="presets" role="radiogroup">${p.lockModes.map(lm => perfLockCard(lm, v('lockMode', 'serial'))).join('')}</div>
      <div class="note">Events that workers emit (chained machines) always go through the lock workflows. Direct needs each entity's events on one shard:
        the generator partitions by the entity key in that mode.</div></div>
    <div class="panel"><h3>4. Chaos and services</h3>
      <div class="perfform">
        <label><input type="checkbox" id="pf-chaos" ${v('chaos', false) ? 'checked' : ''} onchange="perfForm.chaos=this.checked;savePerfForm()"> include chaos: a random coordinator or worker goes down every</label>
        <label><input type="number" id="pf-every" min="5" max="600" value="${v('chaosEvery', 20)}" oninput="perfForm.chaosEvery=+this.value;savePerfForm()"> s</label>
        <label><input type="checkbox" id="pf-kafka" ${v('chaosKafka', false) ? 'checked' : ''} onchange="perfForm.chaosKafka=this.checked;savePerfForm()"> chaos may stop Kafka too</label>
      </div>
      <div class="perfform">
        <label><input type="checkbox" id="pf-analytics" ${v('stopAnalytics', true) ? 'checked' : ''} onchange="perfForm.stopAnalytics=this.checked;savePerfForm()">
          stop the analytics services (DuckDB sink, ClickHouse, Deephaven, Legend, market data) for performance-only metrics</label>
      </div>
      <div class="note">Victims stay down 3 to 12 s (SIGKILL or a graceful SIGTERM), then start again. You can also kill or stop any instance, or Kafka, by hand once the run is up.
        Temporal, Postgres and Kinesis keep running: they hold the work while processes are down.</div></div>
    <div class="panel"><div class="ops">
      <button class="primary" onclick="perfStart()" ${jobRunning(p.job) || p.docker ? 'disabled' : ''}>${others.length || analyticsUp.length ? 'Stop all other services and start' : 'Start'}</button>
      <span class="muted">${others.length ? `stops ${esc(others.map(o => o.label).join(', '))}` : 'no other flow is running'}${analyticsUp.length && v('stopAnalytics', true)
        ? ` · stops ${esc(analyticsUp.join(', '))}` : ''}</span></div></div>`;
}
const LOCK_MODES = {
  serial: ['Serial keys (as declared)', "Events carry the catalog's lock keys (e.g. an order's account): multi-key events take them in order through the lock workflows. The production setup."],
  entity: ['Entity key only', 'Each event locks its own entity only, still through the lock workflows: no serialization across entities (accounts no longer queue).'],
  direct: ['No locks (direct)', 'Entity key only, and the coordinators skip the lock workflows (DIRECT_SM_TYPES): events go straight to their entity, ordered by the shard.'],
};
function perfLockCard(lm, cur) {
  const [label, note] = LOCK_MODES[lm] || [lm, ''];
  return `<div class="preset ${lm === cur ? 'on' : ''}" tabindex="0" role="radio" aria-checked="${lm === cur}"
      onclick="perfForm.lockMode='${lm}';savePerfForm();renderPerf(perfLast,null)" onkeydown="if(event.key==='Enter'||event.key===' '){perfForm.lockMode='${lm}';savePerfForm();renderPerf(perfLast,null)}">
      <span class="lbl">${esc(label)}</span><span class="muted" style="font-size:12px">${esc(note)}</span></div>`;
}
function perfPick(id) {
  const pr = perfLast.presets.find(x => x.id === id);
  perfForm = { ...perfForm, preset: id, coordinators: pr.coordinators, workers: pr.workers, rate: pr.rate };
  savePerfForm(); renderPerf(perfLast, null);
}
async function perfStart() {
  const f = perfFlow(perfLast), pr = perfPreset(perfLast);
  const val = id => document.getElementById(id);
  const q = new URLSearchParams({ flow: f.id, preset: pr.id, machine: val('pf-machine').value, coordinators: val('pf-coord').value,
    workers: val('pf-work').value, rate: val('pf-rate').value, duration: val('pf-dur').value, chaos: val('pf-chaos').checked,
    chaosEvery: val('pf-every').value, chaosKafka: val('pf-kafka').checked, stopAnalytics: val('pf-analytics').checked,
    lockMode: perfForm.lockMode || 'serial' });
  const others = perfLast.otherFlowsRunning || [];
  if (others.length && !confirm(`Start the performance run on ${f.label}?\n\nThis stops ${others.map(o => o.label).join(', ')} first (only one flow runs at a time).`)) return;
  perfForm = { ...perfForm, flow: f.id, machine: val('pf-machine').value }; savePerfForm();
  const d = await apiJson('/api/perf/start?' + q, { method: 'POST' });
  if (d.error) { alert(d.error); return; }
  perfSetup = false; showPerf();
}
async function perfOp(path, ask) {
  if (ask && !confirm(ask)) return;
  const d = await apiJson('/api/perf/' + path, { method: 'POST' });
  if (d.error) alert(d.error);
  showPerf();
}

function perfRunPanel(p) {
  const r = p.run, g = r.generator, f = p.flows.find(x => x.id === r.flow) || { label: r.flow };
  const busy = jobRunning(p.job);
  const loading = g && g.running;
  const pct = g ? Math.min(100, Math.round(g.elapsedSec * 100 / Math.max(1, g.durationSec))) : 0;
  const tuning = Object.entries(r.preset.tuning || {}).map(([k, v]) => `${k}=${v}`).join(' · ') || 'default tuning';
  return `<div class="panel"><div class="ops"><b>${esc(f.label)}</b>${implBadge(f)}
      ${busy ? status('warn', p.job.action + '…') : loading ? status('ok', 'Loading') : status('idle', 'Load finished')}
      ${r.chaos.on ? status('warn', 'Chaos every ' + r.chaos.everySec + ' s' + (r.chaos.kafka ? ' (Kafka too)' : '')) : ''}
      <span class="spacer" style="flex:1"></span>
      <button class="ghost" onclick="perfOp('chaos/${r.chaos.on ? 'off' : 'on'}')" ${busy ? 'disabled' : ''}>${r.chaos.on ? 'Stop chaos' : 'Start chaos'}</button>
      <button class="ghost" onclick="perfOp('restore')" ${busy ? 'disabled' : ''} title="start every stopped instance (and Kafka if this run stopped it)">Restore all</button>
      <button class="danger" onclick="perfOp('stop')" ${busy ? 'disabled' : ''} title="stop the load and chaos and bring back what is down; the flow keeps running">Stop run</button></div>
    <div class="kv" style="margin-top:10px">
      <span class="muted">configuration</span><span>${esc(r.preset.label.split(':')[0])} preset · <b>${r.coordinators}</b> coordinator${r.coordinators === 1 ? '' : 's'} · <b>${r.workers}</b> worker${r.workers === 1 ? '' : 's'} <span class="muted mono">${esc(tuning)}</span></span>
      <span class="muted">load</span><span>${fmt(r.rate)} instances/s on <a class="mono" onclick="go('flow','${esc(r.machine)}')">${esc(r.machine)}</a> for ${fmt(r.durationSec)} s
        ${g ? `<span class="muted">· ${fmt(g.elapsedSec)} s · ${fmt(g.instances)} instances · ${fmt(g.sent)} events sent${g.failed ? ` · <span class="FAILED">${fmt(g.failed)} put failures</span>` : ''}</span>` : ''}</span>
      <span class="muted">lock keys</span><span>${esc((LOCK_MODES[r.lockMode] || [r.lockMode])[0])}</span>
      <span class="muted">started</span><span>${ago(r.startedAt)} · <span class="mono muted">${esc(r.runId)}</span> · ${esc(r.status)}${p.store ? ' · recorded in DuckDB' : ''}</span></div>
    ${g ? `<div class="progress" style="width:100%;margin-top:8px" title="${g.elapsedSec}s of ${g.durationSec}s"><div style="width:${pct}%"></div></div>` : ''}</div>`;
}

function perfInstancesPanel(p) {
  const st = x => x === 'running' ? status('ok', 'running') : x === 'absent' ? status('idle', 'not created') : status(x === 'restarting' ? 'warn' : 'bad', x);
  const btns = (name, state) => `<div class="ops">
      <button class="danger" onclick="perfOp('instance/${encodeURIComponent(name)}/kill')" ${state !== 'running' ? 'disabled' : ''} title="SIGKILL: like a crash">Kill</button>
      <button class="ghost" onclick="perfOp('instance/${encodeURIComponent(name)}/stop')" ${state !== 'running' ? 'disabled' : ''} title="SIGTERM: graceful shutdown">Stop</button>
      <button class="ghost" onclick="perfOp('instance/${encodeURIComponent(name)}/start')" ${state === 'running' ? 'disabled' : ''}>Start</button></div>`;
  const rows = (p.instances || []).map(i => `<tr><td>${esc(i.role)}</td><td class="mono">${esc(i.name)}</td><td>${st(i.state)}</td>
      <td class="muted">${esc(i.status)}</td><td>${btns(i.name, i.state)}</td></tr>`).join('');
  const kafka = `<tr><td>kafka</td><td class="mono">kafka</td><td>${st(p.kafka)}</td><td class="muted">snapshot topics; workers keep transitioning while it is down</td>
      <td><div class="ops"><button class="danger" onclick="perfOp('kafka/stop')" ${p.kafka !== 'running' ? 'disabled' : ''}>Stop</button>
        <button class="ghost" onclick="perfOp('kafka/start')" ${p.kafka === 'running' ? 'disabled' : ''}>Start</button></div></td></tr>`;
  const analytics = (p.analytics || []).map(a => `<span class="svc">${a.state === 'running' ? status('ok', a.service) : status('idle', a.service)}</span>`).join('');
  return `<div class="panel"><h3>Instances</h3>
      <table class="inst"><tr><th>role</th><th>container</th><th>state</th><th>status</th><th></th></tr>${rows}${kafka}</table>
      <div class="note">Kill or stop an instance and watch the pipeline below: coordinator work moves to the other coordinators (shard consumers after the heartbeat timeout),
        worker tasks to the other workers; with none left, events wait in Kinesis and Temporal until one is back.</div>
      <div class="svcs" style="margin-top:8px"><span class="muted" style="font-size:12px">analytics</span>${analytics}</div></div>`;
}

function perfMetrics(d, p) {
  if (!d) return '<div class="panel muted">Loading metrics…</div>';
  if (d.error) return `<div class="panel FAILED">${esc(d.error)}</div>`;
  const stopped = (p.analytics || []).filter(a => a.state !== 'running').map(a => a.service);
  return `${machineSummary(d)}<div class="panel"><div class="flowmap">${pipelineNodes(d)}</div>
      <div class="note">${esc(d.flow.label)}, last ${fmt(d.coveredSec)} s${d.truncated ? ' (trace read capped: newest rows only)' : ''}${d.traceSample < 1 ? ` · trace sampling ${d.traceSample}: counts scaled` : ''}.
        The same view as the machine's flow page: <a onclick="go('flow','${esc(d.flow.id)}')">open it</a> for its coordinator, worker and failures.
        ${stopped.length ? `Stores show down while the analytics services are stopped (${esc(stopped.join(', '))}): this run measures Kinesis → coordinator → worker.` : ''}</div></div>`;
}

function perfTimeline(p) {
  const marks = [...(p.run.timeline || [])].reverse();
  const cls = a => a.includes('KILL') ? 'bad' : a.startsWith('CHAOS') || a === 'STOP' ? 'warn' : a === 'START' || a === 'LOAD' ? 'ok' : '';
  return `<div class="panel"><h3>Timeline</h3>${marks.length ? `<table class="tl"><tr><th>time</th><th>action</th><th>target</th><th>detail</th></tr>
      ${marks.map(m => `<tr><td class="mono">${time(m.ts)}</td><td class="act ${cls(m.action)}">${esc(m.action)}</td><td class="mono">${esc(m.target)}</td>
        <td class="muted">${esc(m.detail)}</td></tr>`).join('')}</table>` : '<div class="muted">Nothing yet.</div>'}
    <div class="note">Every manual and chaos action, newest first: line them up with dips in the completions above.</div></div>`;
}

// ---------------------------------------------------------------- Performance: past runs (DuckDB) and comparison

let perfRuns = null, perfRunsAt = 0, perfSel = [];
const SERIES = ['var(--series-1)', 'var(--series-2)', 'var(--series-3)', 'var(--series-4)'];
const lockLabel = lm => (LOCK_MODES[lm] || [lm || '–'])[0];
const num = (v, d = 1) => v === null || v === undefined ? '–' : fmt(Math.round(v * 10 ** d) / 10 ** d);
const runName = r => `${r.flow} · ${r.preset} · ${r.coordinators}c/${r.workers}w · ${lockLabel(r.lock_mode).split(' (')[0].toLowerCase()}${r.chaos ? ' · chaos' : ''}`;

function perfHistoryPanel(p) {
  if (!p.store) return `<div class="panel muted">Past runs are not kept: the dashboard could not open its DuckDB file (PERF_DB).</div>`;
  if (perfRuns === null || Date.now() - perfRunsAt > 15000) loadPerfRuns(); // refreshed while the page polls
  if (perfRuns === null) return '<div class="panel muted">Loading past runs…</div>';
  if (!perfRuns.length) return `<div class="panel"><h3>Past runs</h3><div class="muted">None yet: every run is recorded in <span class="mono">${esc(p.store)}</span>.</div></div>`;
  const row = r => {
    const on = perfSel.includes(r.run_id);
    const st = r.status === 'completed' ? status('ok', 'completed') : r.status === 'running' ? status('warn', 'running') : status('idle', r.status);
    return `<tr class="${on ? 'sel' : ''}"><td><input type="checkbox" aria-label="select ${esc(r.run_id)}" ${on ? 'checked' : ''} onchange="perfToggle('${esc(r.run_id)}')"></td>
      <td class="mono">${time(r.started_at).slice(0, 8)} <span class="muted">${new Date(r.started_at).toISOString().slice(0, 10)}</span></td>
      <td class="mono">${esc(r.flow)}${r.coordinator_impl === 'rust' ? ' <span class="badge">Rust</span>' : ''}</td>
      <td>${esc(r.preset)}</td><td>${r.coordinators}c / ${r.workers}w</td><td>${num(r.rate)}/s</td><td>${esc(lockLabel(r.lock_mode))}</td>
      <td>${r.chaos ? 'yes' : '–'}</td><td>${st}</td>
      <td class="num">${num(r.avg_completed_per_sec)}/s</td><td class="num">${ms(r.latency_p95)}</td><td class="num ${r.errored ? 'FAILED' : ''}">${fmt(r.errored || 0)}</td>
      <td><button class="ghost" style="padding:2px 8px;font-size:12px" onclick="perfDeleteRun('${esc(r.run_id)}')" ${r.status === 'running' ? 'disabled' : ''}>Delete</button></td></tr>`;
  };
  return `<div class="panel"><div class="ops"><h3 style="margin:0">Past runs</h3><span class="muted">${perfRuns.length} recorded in <span class="mono">${esc(p.store)}</span></span>
      <span class="spacer" style="flex:1"></span>
      <button class="primary" onclick="go('perf-compare')" ${perfSel.length < 2 ? 'disabled' : ''} title="select 2 to 4 runs">Compare ${perfSel.length || ''} selected</button></div>
    <div style="overflow-x:auto"><table class="runs" style="margin-top:8px"><tr><th></th><th>started</th><th>flow</th><th>preset</th><th>instances</th><th>load</th><th>lock keys</th>
      <th>chaos</th><th>status</th><th>completions</th><th>p95 latency</th><th>errors</th><th></th></tr>${perfRuns.map(row).join('')}</table></div>
    <div class="note">Completions: mean of the 10 s samples while loading. p95 latency: mean of the samples' p95 (Kinesis read → transition persisted). Select up to four to compare.</div></div>`;
}
async function loadPerfRuns() {
  perfRunsAt = Date.now();
  const d = await apiJson('/api/perf/runs?limit=50');
  perfRuns = d.error ? [] : d.runs;
  perfSel = perfSel.filter(id => perfRuns.some(r => r.run_id === id));
  const el = document.getElementById('perf-history'); if (el && perfLast) el.innerHTML = perfHistoryPanel(perfLast);
}
function perfToggle(id) {
  perfSel = perfSel.includes(id) ? perfSel.filter(x => x !== id) : perfSel.length >= 4 ? perfSel : [...perfSel, id];
  const el = document.getElementById('perf-history'); if (el) el.innerHTML = perfHistoryPanel(perfLast);
}
async function perfDeleteRun(id) {
  if (!confirm(`Delete run ${id} and its samples from the DuckDB history?`)) return;
  const d = await apiJson(`/api/perf/runs/${encodeURIComponent(id)}/delete`, { method: 'POST' });
  if (d.error) { alert(d.error); return; }
  perfSel = perfSel.filter(x => x !== id); perfRuns = null; loadPerfRuns();
}

async function showPerfCompare(ids) {
  setView('perf'); clearTimeout(perfTimer);
  const list = (ids || perfSel.join(',')).split(',').filter(Boolean);
  setHash('perf/compare/' + list.map(encodeURIComponent).join(','));
  out.innerHTML = '<div class="panel muted">Loading runs…</div>';
  const d = await apiJson('/api/perf/compare?ids=' + encodeURIComponent(list.join(',')));
  if (!location.hash.startsWith('#perf/compare')) return;
  if (d.error) { out.innerHTML = `<div class="panel FAILED">${esc(d.error)}</div>`; return; }
  const runs = d.runs.map((r, i) => ({ ...r, color: SERIES[i], letter: 'ABCD'[i] }));
  const legend = `<div class="legend">${runs.map(r => `<span><span class="swatch" style="background:${r.color}"></span><b>${r.letter}</b> ${esc(runName(r))}
      <span class="muted">${new Date(r.started_at).toISOString().slice(0, 16).replace('T', ' ')}</span></span>`).join('')}</div>`;
  // rows: [label, value(r), formatted(r), better: 'high' | 'low' | null]
  const rows = [
    ['flow', r => r.flow, r => esc(r.flow) + (r.coordinator_impl === 'rust' ? ' <span class="badge">Rust</span>' : ' <span class="badge">Java</span>'), null],
    ['preset', r => r.preset, r => esc(r.preset), null],
    ['coordinators / workers', null, r => `${r.coordinators} / ${r.workers}`, null],
    ['load', null, r => `${num(r.rate)} instances/s on <span class="mono">${esc(r.machine)}</span>`, null],
    ['lock keys', null, r => esc(lockLabel(r.lock_mode)), null],
    ['chaos', null, r => r.chaos ? `every ${r.chaos_every_sec} s${r.chaos_kafka ? ' (+Kafka)' : ''} · ${fmt(r.disruptions)} disruptions` : (r.disruptions ? fmt(r.disruptions) + ' manual' : '–'), null],
    ['status', null, r => esc(r.status), null],
    ['completions / s (mean)', r => r.avg_completed_per_sec, r => num(r.avg_completed_per_sec), 'high'],
    ['completions / s (peak)', r => r.peak_completed_per_sec, r => num(r.peak_completed_per_sec), 'high'],
    ['events processed / s', r => r.avg_processed_per_sec, r => num(r.avg_processed_per_sec), 'high'],
    ['completed', r => r.completed, r => fmt(r.completed || 0), 'high'],
    ['event latency p50 (median)', r => r.latency_p50, r => ms(r.latency_p50), 'low'],
    ['event latency p95 (mean)', r => r.latency_p95, r => ms(r.latency_p95), 'low'],
    ['event latency p99 (worst)', r => r.latency_p99_max, r => ms(r.latency_p99_max), 'low'],
    ['instance lifetime p50', r => r.lifetime_p50, r => ms(r.lifetime_p50), 'low'],
    ['errors', r => r.errored, r => fmt(r.errored || 0), 'low'],
    ['rejected', r => r.rejected, r => fmt(r.rejected || 0), 'low'],
  ];
  const best = (f, dir) => { const vs = runs.map(f).filter(v => v !== null && v !== undefined); return vs.length < 2 ? null : dir === 'high' ? Math.max(...vs) : Math.min(...vs); };
  const table = `<table class="cmp"><tr><th></th>${runs.map(r => `<th class="run"><span class="swatch" style="background:${r.color}"></span>${r.letter}</th>`).join('')}</tr>
    ${rows.map(([label, val, show, dir]) => { const b = dir ? best(val, dir) : null;
      return `<tr><td class="muted">${label}</td>${runs.map(r => `<td class="num ${b !== null && val(r) === b ? 'best' : ''}">${show(r)}</td>`).join('')}</tr>`; }).join('')}</table>`;
  const ser = (key) => runs.map(r => ({ label: r.letter, color: r.color, pts: r.series.filter(x => x[key] !== null && x[key] !== undefined).map(x => [x.t_sec, x[key]]),
    marks: r.marks.filter(m => m.action.startsWith('CHAOS') || m.action === 'KILL' || m.action === 'STOP').map(m => [Math.max(0, Math.round((m.ts - (r.series[0]?.ts || m.ts) + (r.series[0]?.t_sec || 0) * 1000) / 1000)), m.action + ' ' + m.target.replace('concert-temporal-', '')]) }));
  out.innerHTML = `<div id="perf-cmp"><div class="crumbs"><a onclick="showPerf()">Performance</a><span class="sep">›</span><h2>Compare ${runs.length} runs</h2>
      <span class="spacer"></span><button class="ghost" onclick="showPerf()">Back</button></div>
    <div class="panel">${legend}${table}
      <div class="note">Best value per metric in bold. Latency figures summarise the 10 s samples' percentiles, not individual events.</div></div>
    <div class="panel"><div class="charts">
      ${lineChart('c-done', 'Completions / s', r => num(r) + '/s', ser('completed_per_sec'))}
      ${lineChart('c-proc', 'Events processed / s', r => num(r) + '/s', ser('processed_per_sec'))}
      ${lineChart('c-p95', 'Event latency p95', r => ms(r), ser('latency_p95'))}</div>
      <div class="note">x: seconds since the load started (10 s samples; the load ends, then 30 s of drain). Ticks under a chart are chaos and manual kills / stops of that run.</div></div></div>`;
}

const perfChartData = {};
/** A line chart of up to four runs: one y axis, 2px lines, end labels, a crosshair tooltip. */
function lineChart(id, title, fmtv, series) {
  const W = 560, H = 210, L = 52, R = 22, T = 10, B = 34;
  const all = series.flatMap(s => s.pts);
  if (!all.length) return `<div class="chart"><h4>${esc(title)}</h4><div class="muted">No samples.</div></div>`;
  const xmax = Math.max(10, ...all.map(p => p[0]));
  const raw = Math.max(...all.map(p => p[1])) || 1;
  const mag = 10 ** Math.floor(Math.log10(raw)), step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(st => raw / st <= 4) || mag * 10;
  const ymax = Math.ceil(raw / step) * step;
  const x = t => L + (t / xmax) * (W - L - R), y = v => T + (1 - v / ymax) * (H - T - B);
  const yt = []; for (let v = 0; v <= ymax + 1e-9; v += step) yt.push(v);
  const xs = [30, 60, 120, 300, 600, 900].find(st => xmax / st <= 6) || 1800, xt = []; for (let t = 0; t <= xmax; t += xs) xt.push(t);
  const lines = series.map(s => s.pts.length ? `<path d="${s.pts.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join(' ')}"
      fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : '').join('');
  // end labels, nudged apart vertically when runs end on (nearly) the same value
  const endPts = series.filter(s => s.pts.length).map(s => { const p = s.pts.at(-1); return { s, px: x(p[0]) + 4, py: y(p[1]) + 4 }; })
    .sort((a, b) => a.py - b.py);
  endPts.forEach((e, i) => { if (i && e.py - endPts[i - 1].py < 11) e.py = endPts[i - 1].py + 11; });
  const shift = Math.max(0, (endPts.at(-1)?.py ?? 0) - (H - B + 4));
  const ends = endPts.map(e => `<text class="end" x="${e.px}" y="${e.py - shift}">${esc(e.s.label)}</text>`).join('');
  const ticks = series.map((s, i) => s.marks.map(([t, what]) => `<line x1="${x(Math.min(t, xmax))}" x2="${x(Math.min(t, xmax))}" y1="${H - B + 4 + i * 3}" y2="${H - B + 9 + i * 3}"
      stroke="${s.color}" stroke-width="2"><title>${esc(s.label + ': ' + what)}</title></line>`).join('')).join('');
  perfChartData[id] = { series, x, xmax, L, R, W, fmtv };
  return `<div class="chart" id="${id}"><h4>${esc(title)}</h4>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} over time, ${series.length} runs">
      <g class="axis">${yt.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${esc(fmtv(v))}</text>`).join('')}
        ${xt.map(t => `<text x="${x(t)}" y="${H - B + 22}" text-anchor="middle">${t}s</text>`).join('')}</g>
      ${lines}${ends}${ticks}
      <line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>
      <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" onmousemove="chartHover(event,'${id}')" onmouseleave="chartHover(null,'${id}')"/>
    </svg><div class="tip"></div></div>`;
}
function chartHover(e, id) {
  const el = document.getElementById(id), c = perfChartData[id]; if (!el || !c) return;
  const tip = el.querySelector('.tip'), xh = el.querySelector('.xh');
  if (!e) { tip.style.display = 'none'; xh.style.display = 'none'; return; }
  const svg = el.querySelector('svg'), box = svg.getBoundingClientRect(), sx = c.W / box.width;
  const px = (e.clientX - box.left) * sx, t = Math.max(0, Math.min(c.xmax, (px - c.L) / (c.W - c.L - c.R) * c.xmax));
  const near = s => s.pts.reduce((b, p) => !b || Math.abs(p[0] - t) < Math.abs(b[0] - t) ? p : b, null);
  const rows = c.series.map(s => { const p = near(s); return p ? `<div><span class="swatch" style="background:${s.color}"></span>${esc(s.label)} ${esc(c.fmtv(p[1]))} <span class="muted">at ${p[0]}s</span></div>` : ''; }).join('');
  xh.setAttribute('x1', c.x(t)); xh.setAttribute('x2', c.x(t)); xh.style.display = '';
  tip.innerHTML = rows; tip.style.display = 'block';
  const left = (e.clientX - el.getBoundingClientRect().left) + 14;
  tip.style.left = Math.min(left, el.clientWidth - tip.offsetWidth - 4) + 'px'; tip.style.top = '28px';
}

function route() {
  const [hv, hid, hextra] = location.hash.slice(1).split('/');
  if (hv === 'analytics') showAnalytics(hid || 'duckdb', hextra ? decodeURIComponent(hextra) : undefined);
  else if (hv === 'events') go('events', hid ? decodeURIComponent(hid) : 'errors');
  else if (hv === 'diagrams') showDiagrams(hid ? decodeURIComponent(hid) : undefined);
  else if (hv === 'model') showModel(hid ? decodeURIComponent(location.hash.slice('#model/'.length)) : undefined, !!hid);
  else if (hv === 'flow' && hid) go('flow', location.hash.slice('#flow/'.length).split('/').map(decodeURIComponent).join('/'));
  else if (hv === 'perf') { if (hid === 'compare') showPerfCompare(decodeURIComponent(hextra || '')); else showPerf(); }
  else if (hv === 'event' && !hid) { setView('event'); showRecent(); }
  else if (hv && hid) go(hv, decodeURIComponent(hid)); else showFlows();
}
function rerender() { route(); }
apiJson('/api/model/info').then(d => { if (d.studioUrl) studioUrl = d.studioUrl + '/demo/index.html?concert=' + encodeURIComponent(d.studioProjectId || ''); updateFlowNav(); })
  .catch(() => {});
loadControl().catch(() => {}).finally(() => { updateFlowNav(); route(); });
</script>
</body>
