# Latency-oriented settings for the local cluster.
frontend.enableUpdateWorkflowExecution:
  - value: true
frontend.enableExecuteMultiOperation:
  - value: true
system.enableEagerWorkflowStart:
  - value: true
matching.numTaskqueueReadPartitions:
  - value: 4
matching.numTaskqueueWritePartitions:
  - value: 4
limit.maxIDLength:
  - value: 255
system.enableActivityEagerExecution:
  - value: true
# A lock workflow on a hot key (e.g. one account shared by every order) holds an acquire update per
# waiting event plus the releases of its holders; the default of 10 in-flight updates rejects them.
history.maxInFlightUpdates:
  - value: 500
