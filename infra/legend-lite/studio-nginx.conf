# Legend Studio Lite, level 0: the site is static (its compiler and SDLC run in the browser); only its demo projects
# come from concert -- the current models plus the sinks' Legend store layer, from the trace UI.
server {
    listen 8200;
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
    # Docker's DNS, resolved per request: Studio starts even when the trace UI isn't up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = / {
        return 302 /demo/index.html$is_args$args;
    }
    # concert's Diagrams panel (concert-open.js): the emitted models' diagrams from the trace UI
    location = /concert/diagrams {
        set $trace_ui http://trace-ui:8088;
        rewrite ^ /api/model/diagrams break;
        proxy_pass $trace_ui;
    }
    location /demo/projects/ {
        set $trace_ui http://trace-ui:8088;
        rewrite ^/demo/projects/(.*)$ /api/model/studio/$1 break;
        proxy_pass $trace_ui;
    }
}
