[versions]
temporal = "1.40.0"
awssdk = "2.55.11"
jackson = "2.22.3"
postgres = "42.7.13"
hikari = "7.1.0"
slf4j = "2.0.17"
junit = "6.1.3"
jqwik = "1.10.1"
testcontainers = "2.0.5"
hdrhistogram = "2.2.2"
dsql = "1.5.0"

[libraries]
temporal-sdk = { module = "io.temporal:temporal-sdk", version.ref = "temporal" }
temporal-testing = { module = "io.temporal:temporal-testing", version.ref = "temporal" }
aws-bom = { module = "software.amazon.awssdk:bom", version.ref = "awssdk" }
aws-kinesis = { module = "software.amazon.awssdk:kinesis" }
aws-netty = { module = "software.amazon.awssdk:netty-nio-client" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
postgres = { module = "org.postgresql:postgresql", version.ref = "postgres" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
dsql-connector = { module = "software.amazon.dsql:aurora-dsql-jdbc-connector", version.ref = "dsql" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers = { module = "org.testcontainers:testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
hdrhistogram = { module = "org.hdrhistogram:HdrHistogram", version.ref = "hdrhistogram" }
