# Local stack. STORE_KIND (see .env) picks the database the platform writes to:
#   postgres -> "dsql" service (Postgres 16 standing in for Aurora DSQL), profile "postgres"
#   dynamo   -> DynamoDB inside the localstack service (always running)
#   spanner  -> Cloud Spanner emulator, profile "spanner"
# Profile "apps" also runs coordinator, workers and dashboard as containers.
# Profile "analytics" runs Kafka (entity-snapshots + market-data topics), the DuckDB sink, ClickHouse (+ its
# one-shot provisioner), Deephaven and the market-data simulator; profile "kafka-ui" adds Redpanda Console.
# Profile "trading" runs the trading worker (trading_order / _execution / _fill / _allocation machines);
# "trading-load" is the one-shot order-flow generator (scripts/trading-load.sh [orders] [rate]).
#
#   scripts/up.sh spanner --analytics   # + analytics profile; without it workers don't publish snapshots
#   scripts/up.sh spanner --analytics --trading && scripts/trading-load.sh 100 50   # trading showcase
#
#   scripts/up.sh spanner          # = STORE_KIND=spanner COMPOSE_PROFILES=spanner,apps docker compose up -d --build
#   docker compose up -d           # infrastructure only, per .env (apps run from Gradle / scripts)
#
#   Temporal UI: http://localhost:8080   Dashboard: http://localhost:8088   Temporal gRPC: localhost:7233
#   LocalStack:  http://localhost:4566   Postgres: localhost:5433 (concert/concert)   Spanner: localhost:9010
#   Kafka:       localhost:29092 (host)  kafka:9092 (containers)   DuckDB sink: http://localhost:8090
#   ClickHouse:  http://localhost:8123 (Play UI /play; users concert/concert, readonly/readonly)  native :9000
#   Deephaven:   http://localhost:10000/ide/ (PSK ${DEEPHAVEN_PSK:-concert})   Redpanda Console: http://localhost:8081
name: concert-temporal

x-app-env: &app-env
  STORE_KIND: ${STORE_KIND:-postgres}
  TEMPORAL_ADDRESS: temporal:7233
  KINESIS_ENDPOINT: http://localstack:4566
  STORE_JDBC_URL: jdbc:postgresql://dsql:5432/concert
  DYNAMO_ENDPOINT: http://localstack:4566
  SPANNER_EMULATOR_HOST: spanner:9010
  TRACE_SAMPLE: ${TRACE_SAMPLE:-1.0}
  AWS_REGION: us-east-1
  # Temporal / worker tuning (defaults = the code's; the dashboard's Performance presets set them per run)
  WORKFLOW_TASK_TIMEOUT_MS: ${WORKFLOW_TASK_TIMEOUT_MS:-2000}
  WORKER_WF_SLOTS: ${WORKER_WF_SLOTS:-1000}
  WORKER_LA_SLOTS: ${WORKER_LA_SLOTS:-2000}
  ORCH_WF_POLLERS_MAX: ${ORCH_WF_POLLERS_MAX:-64}
  INGEST_PARALLEL_GROUPS: ${INGEST_PARALLEL_GROUPS:-256}
  # coordinators: smTypes whose single-key events skip the lock workflows (the Performance page's "direct" lock mode)
  DIRECT_SM_TYPES: ${DIRECT_SM_TYPES:-}
  # Completed-entity snapshots. scripts/up.sh without --analytics sets KAFKA_BOOTSTRAP= (empty), so
  # workers use the no-op publisher; when it is set but Kafka is down, publishes retry until it is up.
  KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP-kafka:9092}
  # Reconciliation (typed workers): ReconcileWorkflow compares the StateStore with the DuckDB sink's read-only
  # POST /versions; with Kafka set, each worker creates the hourly Temporal Schedule reconcile-<smType>.
  SINK_DUCKDB_URL: http://sink-duckdb:8090

# Completed-entity roots of the analytics sinks (smType:pure::Class). Root table = plural(snake(smType)):
# orders, payments, shipments (+ child tables order_lines, ...) and trading_orders, trading_executions,
# trading_fills, trading_allocations. Associations between trading roots (Order.executions, ...) are not
# child tables: each aggregate is its own snapshot, joined on orderId / execId.
x-sink-roots: &sink-roots >-
  order:demo::order::Order,payment:demo::payment::Payment,shipment:demo::shipment::Shipment,trading_order:trading::order::Order,trading_execution:trading::order::Execution,trading_fill:trading::order::Fill,trading_allocation:trading::order::Allocation

# The database container depends on STORE_KIND, so apps don't depend_on it (optional dependencies
# need compose >= 2.20); if it isn't ready yet an app exits and "restart: unless-stopped" retries.
x-app-deps: &app-deps
  temporal-init: { condition: service_completed_successfully }
  localstack: { condition: service_healthy }

services:
  localstack:
    image: localstack/localstack:4.12
    restart: unless-stopped   # core infra: a crash (e.g. an OOM kill) must not leave the platform down
    ports: ["4566:4566"]
    environment:
      SERVICES: kinesis,dynamodb
      KINESIS_SHARDS: ${KINESIS_SHARDS:-4}
      KINESIS_LATENCY: "0"
    volumes:
      - ./infra/localstack-init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "awslocal kinesis describe-stream-summary --stream-name concert-events >/dev/null"]
      interval: 3s
      retries: 40

  dsql:
    profiles: [postgres]
    image: postgres:16
    restart: unless-stopped   # core infra: a crash (e.g. an OOM kill) must not leave the platform down
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: concert
      POSTGRES_PASSWORD: concert
      POSTGRES_DB: concert
    # pg_stat_statements: per-statement call counts for scripts/db-load.sh
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all",
              "-c", "max_connections=300"]
    volumes:
      - dsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concert"]
      interval: 2s
      retries: 30

  temporal-db:
    image: postgres:16
    restart: unless-stopped   # core infra: a crash (e.g. an OOM kill) must not leave the platform down
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    command: ["postgres", "-c", "max_connections=400"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 2s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.29.7
    restart: unless-stopped   # core infra: a crash (e.g. an OOM kill) must not leave the platform down
    depends_on:
      temporal-db: { condition: service_healthy }
    ports: ["7233:7233"]
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
      NUM_HISTORY_SHARDS: 16
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/concert.yaml
    volumes:
      - ./infra/temporal-init/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/concert.yaml:ro
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 3s
      retries: 60

  temporal-init:
    image: temporalio/admin-tools:1.29
    depends_on:
      temporal: { condition: service_healthy }
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - ./infra/temporal-init:/init:ro
    entrypoint: ["bash", "/init/register-search-attributes.sh"]
    restart: "no"

  temporal-ui:
    image: temporalio/ui:2.55.0
    restart: unless-stopped   # core infra: a crash (e.g. an OOM kill) must not leave the platform down
    depends_on: [temporal]
    ports: ["8080:8080"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000

  spanner:
    profiles: [spanner]
    image: gcr.io/cloud-spanner-emulator/emulator:latest
    ports: ["9010:9010", "9020:9020"]

  # ---------------------------------------------------------------- apps (profile "apps")

  # COORDINATOR_TARGET=coordinator-rs (scripts/up.sh ... --rust-coordinator) runs every flow's coordinator as the Rust
  # coordinator (platform/coordinator-rs): same contract, postgres / dsql / dynamo only. One implementation per
  # Temporal namespace at a time: they cannot replay each other's lock histories.
  # Each flow (ecosystem) has its own coordinator, Kinesis stream concert-<flow>, orchestration-<flow> task queue and
  # Kafka topic snapshots.<flow> (CONCERT_FLOW, io.concert.common.Flows), so flows never overlap. The dashboard's flow
  # page starts / stops / deletes a flow's coordinator and workers. Scale out: --scale samples-coordinator=3
  samples-coordinator:
    profiles: [apps]
    build: { context: ., target: "${COORDINATOR_TARGET:-coordinator}" }
    image: concert-temporal/${COORDINATOR_TARGET:-coordinator}
    depends_on: *app-deps
    environment:
      <<: *app-env
      CONCERT_FLOW: samples
    restart: unless-stopped

  worker:
    profiles: [apps]
    build: { context: ., target: worker }
    image: concert-temporal/worker
    depends_on:
      <<: *app-deps
      samples-coordinator: { condition: service_started }
    environment:
      <<: *app-env
      CONCERT_FLOW: samples
      SM_TYPE: ${SM_TYPE:-order,payment,shipment,ledger}
      # event-style demo domain (showcases/sample-workers .../events/DemoEvents): EVENT_DOMAINS=demo to enable
      EVENT_DOMAINS: ${EVENT_DOMAINS:-}
      STORE_INIT_SCHEMA: "false"
    restart: unless-stopped

  trading-coordinator:
    profiles: [trading]
    build: { context: ., target: "${COORDINATOR_TARGET:-coordinator}" }
    image: concert-temporal/${COORDINATOR_TARGET:-coordinator}
    depends_on: *app-deps
    environment:
      <<: *app-env
      CONCERT_FLOW: trading
    restart: unless-stopped

  # Trading showcase workers: the four trading state machines in one process (showcases/trading/README.md).
  trading-worker:
    profiles: [trading]
    build: { context: ., target: trading-worker }
    image: concert-temporal/trading-worker
    depends_on:
      <<: *app-deps
      trading-coordinator: { condition: service_started }
    environment:
      <<: *app-env
      CONCERT_FLOW: trading
      STORE_INIT_SCHEMA: "false"
      # heap 50% of the cap: Temporal's gRPC/netty buffers and four workers' thread pools live off-heap
      JAVA_OPTS: -XX:+UseZGC -XX:+UseCompactObjectHeaders -XX:MaxRAMPercentage=50
    deploy: { resources: { limits: { memory: 1536m } } }
    restart: unless-stopped

  # One-shot: realistic order flow to Kinesis (concert-trading, the trading flow's stream). Same seed and vol multiplier as
  # marketdata-sim, and events are stamped and sent on the wall clock, so every fill sits on the bid/ask
  # that md.ticks shows at the fill's timestamp. scripts/trading-load.sh [orders] [rate] runs it.
  trading-loadgen:
    profiles: [trading-load]
    build: { context: ., target: trading-loadgen }
    image: concert-temporal/trading-loadgen
    depends_on:
      localstack: { condition: service_healthy }
    environment:
      KINESIS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      ORDERS: ${TRADING_ORDERS:-100}
      RATE: ${TRADING_RATE:-50}
      SEED: ${TRADING_SEED:-42}
      VOL_MULT: ${TRADING_VOL_MULT:-4}
      JAVA_OPTS: -XX:+UseCompactObjectHeaders -XX:MaxRAMPercentage=75   # bin/trading already selects ZGC
    deploy: { resources: { limits: { memory: 384m } } }
    restart: "no"

  dashboard:
    profiles: [apps]
    build: { context: ., target: dashboard }
    image: concert-temporal/dashboard
    depends_on: *app-deps
    ports: ["8088:8088"]
    # Start / Stop / Delete flow and the shared-services switch run docker compose (FlowOps): the host's Docker socket
    # (root on the host: local development only) and the repo at its host path, so bind mounts resolve the same.
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:${PWD}:ro
      - dashboard-data:/data   # Performance page history (PERF_DB, DuckDB)
    environment:
      PERF_DB: /data/perf-runs.duckdb
      <<: *app-env
      CONCERT_REPO: ${PWD}
      TEMPORAL_UI_URL: http://localhost:8080
      COORDINATOR_TARGET: ${COORDINATOR_TARGET:-coordinator}   # Start flow builds the same coordinator image
      SINK_DUCKDB_URL: http://sink-duckdb:8090
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: readonly
      CLICKHOUSE_PASSWORD: readonly
      CLICKHOUSE_PUBLIC_URL: http://localhost:8123
      DEEPHAVEN_URL: http://deephaven:10000
      DEEPHAVEN_PUBLIC_URL: http://localhost:10000
      DEEPHAVEN_PSK: ${DEEPHAVEN_PSK:-concert}
      REDPANDA_CONSOLE_URL: http://redpanda-console:8080
      REDPANDA_CONSOLE_PUBLIC_URL: http://localhost:8081
      MARKETDATA_URL: http://marketdata-sim:8091   # "simulate market data" (marketdata-sim's control endpoint)
      LEGEND_LITE_URL: http://legend-lite:8095     # Model query tab: plans Pure queries as SQL (profile analytics)
      LEGEND_STUDIO_PUBLIC_URL: http://localhost:8200   # "Open in Legend Studio" link (legend-studio, level 0)
    restart: unless-stopped

  # ---------------------------------------------------------------- analytics (profile "analytics")

  kafka:
    profiles: [analytics]
    image: apache/kafka:4.3.1
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
    volumes:
      - kafka-data:/var/lib/kafka/data
    # deephaven / marketdata-sim / sinks come back on daemon restart; Kafka must too or they crash-loop.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  # One-shot: all topics (infra/kafka-init/create-topics.sh): the compacted snapshot topic (latest record
  # per entity id survives compaction) and the market-data topics (configs as in marketdata-sim's MdTopics).
  kafka-init:
    profiles: [analytics]
    image: apache/kafka:4.3.1
    depends_on:
      kafka: { condition: service_healthy }
    volumes:
      - ./infra/kafka-init:/init:ro
    entrypoint: ["bash", "/init/create-topics.sh"]
    restart: "no"

  sink-duckdb:
    profiles: [analytics]
    build: { context: ., target: sink-duckdb }
    image: concert-temporal/sink-duckdb
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    ports: ["8090:8090"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      MODELS_DIR: /models,/models-trading
      SINK_ROOTS: *sink-roots
      DUCKDB_PATH: /data/concert.duckdb
    volumes:
      - ./showcases/sample-workers/src/main/pure:/models:ro
      - ./core/trading-model/src/main/pure:/models-trading:ro
      - duckdb-data:/data
    restart: unless-stopped

  clickhouse:
    profiles: [analytics]
    image: clickhouse/clickhouse-server:26.3
    ports: ["8123:8123", "9000:9000"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ./infra/clickhouse/config.d/concert.xml:/etc/clickhouse-server/config.d/concert.xml:ro
      - ./infra/clickhouse/users.d/concert.xml:/etc/clickhouse-server/users.d/concert.xml:ro
      - clickhouse-data:/var/lib/clickhouse
    deploy: { resources: { limits: { memory: 2g } } }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 3s
      retries: 40
    restart: unless-stopped

  # One-shot: generates the ClickHouse schema from the Pure models (Kafka engine queues, materialized views,
  # ReplacingMergeTree per type, market-data tables) and applies it idempotently; ClickHouse then consumes.
  sink-clickhouse:
    profiles: [analytics]
    build: { context: ., target: sink-clickhouse }
    image: concert-temporal/sink-clickhouse
    depends_on:
      clickhouse: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: concert
      CLICKHOUSE_PASSWORD: concert
      KAFKA_BROKERS: kafka:9092
      MODELS_DIR: /models,/models-trading
      SINK_ROOTS: *sink-roots
      MARKETDATA_MODELS_DIR: /models-trading
    volumes:
      - ./showcases/sample-workers/src/main/pure:/models:ro
      - ./core/trading-model/src/main/pure:/models-trading:ro
    deploy: { resources: { limits: { memory: 256m } } }
    restart: on-failure

  # Market data straight to Kafka (ref.*, md.ticks, md.bars.1m), bypassing concert.
  marketdata-sim:
    profiles: [analytics]
    build: { context: ., target: marketdata-sim }
    image: concert-temporal/marketdata-sim
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TICK_RATE: ${MD_TICK_RATE:-200}
      # Control endpoint (dashboard › flow › Deephaven: start / stop / rate). MD_AUTOSTART=false starts paused.
      CONTROL_PORT: 8091
      AUTOSTART: ${MD_AUTOSTART:-true}
      SEED: ${TRADING_SEED:-42}
      VOL_MULT: ${TRADING_VOL_MULT:-4}
      JAVA_OPTS: -XX:+UseCompactObjectHeaders -XX:MaxRAMPercentage=50
    deploy: { resources: { limits: { memory: 256m } } }
    restart: unless-stopped

  # Live tables over the same topics (infra/deephaven/app.d: Python app-mode script). Restarts rebuild
  # everything from offset 0 (in-memory tables, nothing committed). The app's tables are also globals in the
  # IDE console; notebooks live in ./infra/deephaven/notebooks (starter notebooks + your own, kept on restart).
  deephaven:
    profiles: [analytics]
    image: ghcr.io/deephaven/server:42.5
    ports: ["10000:10000"]
    environment:
      START_OPTS: -Xmx1g -Dauthentication.psk=${DEEPHAVEN_PSK:-concert} -Ddeephaven.application.dir=/app.d
    volumes:
      - ./infra/deephaven/app.d:/app.d:ro
      - ./infra/deephaven/notebooks:/data/storage/notebooks
      - deephaven-data:/data
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    deploy: { resources: { limits: { memory: 2g } } }
    restart: unless-stopped

  # Model query planner: legend-lite (github.com/neema2/legend-lite) pinned to one commit and built from source
  # (infra/legend-lite/Dockerfile; the first build takes a while). The dashboard sends it the concert models plus the
  # Legend store layer generated from the sinks' schema and gets SQL back; concert runs that SQL on DuckDB /
  # ClickHouse itself. Host port 8095 (8080 is the Temporal UI).
  legend-lite:
    profiles: [analytics]
    build:
      context: infra/legend-lite
      target: server
      args: { LEGEND_LITE_REF: "${LEGEND_LITE_REF:-42b43f3cc82d478fc2f70d18682407b27e978efa}" }
    image: concert-temporal/legend-lite
    # Loopback-only on the host: legend-lite runs a model's connection setup, so it must not face the network. Inside
    # compose it listens on all interfaces (LEGEND_LITE_BIND) for the dashboard; browsers never call it (no Origin).
    ports: ["127.0.0.1:8095:8095"]
    environment:
      LEGEND_LITE_BIND: 0.0.0.0
      JAVA_OPTS: -XX:+UseZGC -XX:MaxRAMPercentage=60
    deploy: { resources: { limits: { memory: 1g } } }
    restart: unless-stopped

  # Legend Studio Lite (level 0) from the same pinned build: a static site whose compiler and SDLC run in the browser
  # (projects live in that browser's storage). "Load demo projects" publishes concert's current models plus the
  # generated store layer (its projects/ are proxied to the dashboard). http://localhost:8200; loopback only.
  legend-studio:
    profiles: [analytics]
    build:
      context: infra/legend-lite
      target: studio
      args: { LEGEND_LITE_REF: "${LEGEND_LITE_REF:-42b43f3cc82d478fc2f70d18682407b27e978efa}" }
    image: concert-temporal/legend-studio
    ports: ["127.0.0.1:8200:8200"]
    deploy: { resources: { limits: { memory: 128m } } }
    restart: unless-stopped

  redpanda-console:
    profiles: [kafka-ui]
    image: redpandadata/console:v3.12.0
    ports: ["8081:8080"]
    environment:
      KAFKA_BROKERS: kafka:9092
    restart: unless-stopped

volumes:
  dsql-data:
  dashboard-data:
  kafka-data:
  duckdb-data:
  clickhouse-data:
  deephaven-data:
